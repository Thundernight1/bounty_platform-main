global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'bounty-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics

  - job_name: 'bounty-frontend'
    static_configs:
      - targets: ['frontend:80']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
