# Docker Compose configuration

# PROJE: Bounty Platform
# Bu dosya tüm servislerin ve imajların merkezi tanımını içerir
# Her imaj ne işe yaradığı ve versiyonu açıkça yazılmıştır

services:
  # ========== VERİTABANI ==========
  db:
    image: postgres:15-alpine
    container_name: bounty_platform_db
    labels:
      project: "bounty-platform"
      service: "database"
      description: "PostgreSQL main database for bounty platform"
      version: "15-alpine"
    environment:
      POSTGRES_DB: bounty_platform
      POSTGRES_USER: bounty_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bounty_user -d bounty_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bounty_network
    restart: unless-stopped

  # ========== CACHE/QUEUE ==========
  redis:
    image: redis:7-alpine
    container_name: bounty_platform_redis
    labels:
      project: "bounty-platform"
      service: "cache"
      description: "Redis for Celery task queue and session caching"
      version: "7-alpine"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bounty_network
    restart: unless-stopped

  # ========== BACKEND API ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bounty_platform_backend
    labels:
      project: "bounty-platform"
      service: "api"
      description: "FastAPI backend - main application server"
      language: "python"
      version: "1.0"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bounty_user:${DB_PASSWORD:-changeme}@db:5432/bounty_platform
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: "bounty-backend"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backend/results:/app/backend/results
    networks:
      - bounty_network
    restart: unless-stopped

  # ========== CELERY WORKER ==========
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bounty_platform_celery
    labels:
      project: "bounty-platform"
      service: "background-worker"
      description: "Celery worker for async tasks (scanning, processing)"
      language: "python"
      version: "1.0"
    command: celery -A backend.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bounty_user:${DB_PASSWORD:-changeme}@db:5432/bounty_platform
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: "bounty-celery"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app/backend
    networks:
      - bounty_network
    restart: unless-stopped

  # ========== FRONTEND WEB UI ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bounty_platform_frontend
    labels:
      project: "bounty-platform"
      service: "web-ui"
      description: "React frontend - web interface for bounty platform"
      language: "nodejs"
      version: "1.0"
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - bounty_network
    restart: unless-stopped

  # ========== REVERSE PROXY ==========
  nginx:
    image: nginx:alpine
    container_name: bounty_platform_nginx
    labels:
      project: "bounty-platform"
      service: "proxy"
      description: "Nginx reverse proxy and load balancer"
      version: "alpine"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - bounty_network
    restart: unless-stopped

  # ========== MONITORING ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: bounty_platform_prometheus
    labels:
      project: "bounty-platform"
      service: "metrics"
      description: "Prometheus metrics collection and storage"
      version: "latest"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - bounty_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bounty_platform_grafana
    labels:
      project: "bounty-platform"
      service: "dashboard"
      description: "Grafana monitoring dashboard and visualization"
      version: "latest"
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bounty_network
    restart: unless-stopped

volumes:
  postgresql_data:
    labels:
      project: "bounty-platform"
      type: "persistent"
      description: "PostgreSQL database files"
  prometheus_data:
    labels:
      project: "bounty-platform"
      type: "persistent"
      description: "Prometheus time-series database"
  grafana_data:
    labels:
      project: "bounty-platform"
      type: "persistent"
      description: "Grafana dashboards and configuration"

networks:
  bounty_network:
    driver: bridge
    labels:
      project: "bounty-platform"
      description: "Main network for bounty platform services"
